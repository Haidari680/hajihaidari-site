<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجموعه حاجی حیدری</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1730;--bg2:#10244a;--gold:#d9b04a;--gold2:#f3dc95;--ink:#f7f0dc}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8}
.hide{display:none!important}
.gold{background:linear-gradient(100deg,#b88a2c 20%,#f9eab0 45%,#b88a2c 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
.btn{display:inline-block;padding:13px 34px;border-radius:999px;border:1.5px solid var(--gold);background:linear-gradient(135deg,#b88a2c,#f3dc95 50%,#b88a2c);color:#0a1730;font:800 17px Vazirmatn,Tahoma,sans-serif;text-decoration:none;cursor:pointer}
.btn.o{background:transparent;color:var(--gold2)}
.btn:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:3px}
/* splash */
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:hidden}
.sl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.08);transition:opacity 1.6s;animation:zoom 14s ease-in-out infinite alternate}
.sl.on{opacity:1}
.shade{position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 42%,rgba(10,23,48,.3),rgba(10,23,48,.9) 80%),linear-gradient(180deg,rgba(10,23,48,.55),rgba(10,23,48,.86))}
.sp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.emb{position:relative;width:min(56vw,240px);aspect-ratio:1;display:grid;place-items:center;animation:rise 1.2s both}
.emb img{width:72%;filter:drop-shadow(0 8px 24px rgba(0,0,0,.6))}
.ring{position:absolute;inset:0;border-radius:50%;border:1.5px dashed var(--gold);animation:spin 18s linear infinite}
.r2{inset:7%;border:2px solid transparent;border-top-color:var(--gold2);border-bottom-color:var(--gold2);animation:spin 6s linear infinite reverse}
.sp h1{font-size:clamp(26px,7vw,38px);font-weight:800;animation:rise 1.2s .4s both,shine 5s 1.6s linear infinite}
.sp .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;animation:rise 1.2s .8s both}
.lang{position:absolute;top:max(14px,env(safe-area-inset-top));inset-inline-end:14px;display:flex;gap:6px;z-index:3}
.lang button{background:rgba(10,23,48,.6);color:var(--gold2);border:1px solid rgba(217,176,74,.5);border-radius:999px;padding:3px 12px;font:700 13px Vazirmatn,Tahoma,sans-serif;cursor:pointer}
.lang button.on{background:var(--gold);color:#0a1730}
/* site */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(10,23,48,.92);border-bottom:1px solid rgba(217,176,74,.25)}
header img{height:40px}
section{max-width:960px;margin:0 auto;padding:54px 20px}
h2{font-size:26px;font-weight:800;margin-bottom:18px;text-align:center}
.lead{text-align:center;max-width:620px;margin:0 auto;opacity:.9}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.card{border:1px solid rgba(217,176,74,.4);border-radius:18px;padding:24px;text-align:center;background:linear-gradient(160deg,var(--bg2),var(--bg))}
.card b{display:block;font-size:20px;color:var(--gold2)}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.gal img{width:100%;height:260px;object-fit:cover;border-radius:16px;border:1px solid rgba(217,176,74,.4);cursor:zoom-in}
#lb{position:fixed;inset:0;z-index:60;background:rgba(5,10,22,.95);display:none;place-items:center;cursor:zoom-out}#lb.on{display:grid}#lb img{max-width:96vw;max-height:92vh;border-radius:12px}
.today{border:1.5px solid var(--gold);border-radius:20px;padding:26px;text-align:center;background:var(--bg2)}
.today p{font-size:20px;color:var(--gold2)}
.ct{display:flex;flex-direction:column;gap:10px;align-items:center}
.ct .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ct small{opacity:.7}
.qr{text-align:center}
#qrc{display:inline-block;background:#fff;padding:14px;border-radius:14px;margin:10px 0}
.qr .nm{font-weight:800;color:var(--gold2)}
footer{text-align:center;padding:26px;opacity:.7;font-size:14px}
/* admin */
#adm{position:fixed;inset:0;z-index:70;background:rgba(5,10,22,.96);display:none;overflow:auto;padding:24px 18px}
#adm.on{display:block}
.pn{max-width:480px;margin:0 auto}
.pn h3{color:var(--gold2);margin-bottom:12px}
.tg{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid rgba(217,176,74,.2)}
.tg input{width:22px;height:22px;accent-color:#d9b04a}
.pn input[type=text],.pn input[type=password],.pn textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--gold);background:var(--bg2);color:var(--ink);font:16px Vazirmatn,Tahoma,sans-serif;margin:6px 0}
.note{font-size:13px;opacity:.7;margin:10px 0}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes zoom{to{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes shine{to{background-position:-220% 0}}
@media print{body>*:not(#qrsec){display:none!important}#qrsec{display:block!important;color:#000}.btn{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

 <div class="sl on" data-im="night"></div><div class="sl" data-im="garden"></div><div class="shade"></div>
 <div class="lang" data-f="lang"></div>
 <div class="sp">
  <div class="emb"><div class="ring"></div><div class="ring r2"></div><img data-im="logo" alt="لوگو"></div>
  <h1 class="gold" data-t="name"></h1>
  <p data-t="tag"></p>
  <div class="row"><a class="btn" data-t="menu" href="MENU"></a><button class="btn o" id="go" data-t="site"></button></div>
 </div>
</div>

<section id="about" data-f="about"><h2 class="gold" data-t="about_t"></h2><p class="lead" id="aboutp"></p></section>
<section id="today" data-f="today"><div class="today"><h2 class="gold" data-t="today_t"></h2><p id="todayp"></p><div id="tin" class="hide"><input type="text" id="tinp" placeholder="غذای امروز را بنویسید" style="width:100%;padding:11px;border-radius:10px;border:1px solid #d9b04a;background:#0a1730;color:#f7f0dc;font:16px Vazirmatn,Tahoma,sans-serif;margin-top:12px"><button class="btn" id="tsv" style="margin-top:8px;padding:9px 26px;font-size:15px">ذخیره</button></div></div></section>
<section id="chal" data-f="challenge"><div class="today"><h2 class="gold" data-t="chal_t"></h2><p id="chalp"></p><p id="chalr" style="font-size:17px;opacity:.9"></p><div id="cin" class="hide"><input type="text" id="cit" placeholder="چالش امروز را بنویسید" style="width:100%;padding:11px;border-radius:10px;border:1px solid #d9b04a;background:#0a1730;color:#f7f0dc;font:16px Vazirmatn,Tahoma,sans-serif;margin-top:12px"><input type="text" id="cir" placeholder="جایزه" style="width:100%;padding:11px;border-radius:10px;border:1px solid #d9b04a;background:#0a1730;color:#f7f0dc;font:16px Vazirmatn,Tahoma,sans-serif;margin-top:8px"><button class="btn" id="csv" style="margin-top:8px;padding:9px 26px;font-size:15px">ذخیره</button></div></div></section>
<section id="stalls" data-f="stalls"><h2 class="gold" data-t="stalls_t"></h2><div class="cards"><div class="card"><b data-t="s1"></b></div><div class="card"><b data-t="s2"></b></div><div class="card"><b data-t="s3"></b></div></div></section>
<section id="gallery" data-f="gallery"><h2 class="gold" data-t="gal_t"></h2><div class="gal"><img data-im="garden" alt=""><img data-im="night" alt=""></div></section>
<section id="contact" data-f="contact"><h2 class="gold" data-t="ct_t"></h2><div class="ct" id="ctl"></div></section>
<section id="qrsec" data-f="qr"><div class="qr"><h2 class="gold" data-t="qr_t"></h2><p class="lead" data-t="qr_p"></p><div id="qrc"></div><div class="nm" data-t="name"></div><br><button class="btn" id="pr" data-t="print"></button></div></section>
<footer>© <span data-t="name"></span></footer>
